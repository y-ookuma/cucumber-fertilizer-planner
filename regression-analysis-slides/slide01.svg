<text x="70" y="135" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" font-weight="700" fill="#17281E">回帰分析って、何を見ている？</text>
<text x="70" y="178" font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" fill="#66756B">「環境が変わると、生育や収量がどう動くか」を数字で確かめます。</text>

