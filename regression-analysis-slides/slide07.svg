<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#FAF8EF"/>
<rect x="70" y="52" width="74" height="34" rx="17" fill="#15803D"/><text x="107" y="75" text-anchor="middle" font-size="17" font-weight="700" fill="white">7</text>
<text x="70" y="135" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" font-weight="700" fill="#17281E">最後に：回帰分析は「判断材料」</text>
<text x="70" y="178" font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" fill="#66756B">数値が大きいほど正しい、とは限りません。データの数と背景を一緒に見ます。</text>
<rect x="90" y="235" width="240" height="70" rx="16" fill="#DCFCE7"/><text x="210" y="279" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#17281E">① nを確認</text><text x="365" y="265" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#17281E">組数が少ないと r・R² が大きく振れます。n&lt;10 は特に参考値として見る。</text><rect x="90" y="325" width="240" height="70" rx="16" fill="#DCFCE7"/><text x="210" y="369" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#17281E">② 山の形を見る</text><text x="365" y="355" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#17281E">ラグの山が1か所にまとまるか、記録を増やして再確認する。</text><rect x="90" y="415" width="240" height="70" rx="16" fill="#DCFCE7"/><text x="210" y="459" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#17281E">③ 散布図を見る</text><text x="365" y="445" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#17281E">外れ値1〜2点だけで相関が強く見えていないか確認する。</text><rect x="90" y="505" width="240" height="70" rx="16" fill="#DCFCE7"/><text x="210" y="549" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#17281E">④ 因果と区別</text><text x="365" y="535" font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#17281E">相関があっても、かん水・施肥・着果負担など別要因の影響を考える。</text><rect x="90" y="610" width="1060" height="35" rx="12" fill="#15803D"/><text x="620" y="635" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="700" fill="white">「ラグ → 散布図 → r/R² → 現場の記録」の順に見ると理解しやすい</text><text x="70" y="680" font-family="Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#66756B">きゅうり生育予測ノート｜回帰分析の読み方</text></svg>