<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#FAF8EF"/>
<rect x="70" y="52" width="74" height="34" rx="17" fill="#15803D"/><text x="107" y="75" text-anchor="middle" font-size="17" font-weight="700" fill="white">2</text>
<text x="70" y="135" font-family="Yu Gothic, Meiryo, sans-serif" font-size="42" font-weight="700" fill="#17281E">まず「XとYの組」を作る</text>
<text x="70" y="178" font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" fill="#66756B">このアプリでは、環境側を「ラグ日数」だけ過去へずらします。</text>

<line x1="130" y1="330" x2="1140" y2="330" stroke="#66756B" stroke-width="3"/>
<g font-family="Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#17281E">
<circle cx="240" cy="330" r="18" fill="#0EA5E9"/><text x="240" y="380" text-anchor="middle">環境</text><text x="240" y="405" text-anchor="middle">7日前</text>
<circle cx="360" cy="330" r="18" fill="#0EA5E9"/><text x="360" y="380" text-anchor="middle">6日前</text>
<circle cx="480" cy="330" r="18" fill="#0EA5E9"/><text x="480" y="380" text-anchor="middle">5日前</text>
<circle cx="600" cy="330" r="18" fill="#0EA5E9"/><text x="600" y="380" text-anchor="middle">4日前</text>
<circle cx="720" cy="330" r="18" fill="#0EA5E9"/><text x="720" y="380" text-anchor="middle">3日前</text>
<circle cx="840" cy="330" r="18" fill="#0EA5E9"/><text x="840" y="380" text-anchor="middle">2日前</text>
<circle cx="960" cy="330" r="18" fill="#0EA5E9"/><text x="960" y="380" text-anchor="middle">1日前</text>
<circle cx="1080" cy="330" r="24" fill="#15803D"/><text x="1080" y="380" text-anchor="middle" font-weight="700">調査日 Y</text>
</g>
<rect x="180" y="235" width="550" height="60" rx="16" fill="#E0F2FE"/>
<text x="455" y="273" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#17281E">X = ラグ7日前を含む「直近3日間」の環境平均</text>
<rect x="790" y="235" width="300" height="60" rx="16" fill="#DCFCE7"/>
<text x="940" y="273" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#17281E">Y = 調査日の茎径など</text>
<rect x="190" y="465" width="900" height="90" rx="18" fill="#FEF3C7"/>
<text x="640" y="505" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" fill="#17281E">例：ラグ7日なら、調査日の7日前を含む3日間を平均。</text>
<text x="640" y="538" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" fill="#17281E">こうして「X = 22.4℃、Y = 9.2mm」のような1組を作ります。</text>
<text x="70" y="680" font-family="Yu Gothic, Meiryo, sans-serif" font-size="15" fill="#66756B">きゅうり生育予測ノート｜回帰分析の読み方</text></svg>