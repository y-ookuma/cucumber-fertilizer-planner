# ACFinder（macs-labo/macs）の acis.db・spec.db を取得して、RACコードの表 data/rac.json を更新する。
# DB本体はリポジトリに入れない（FAMICデータの再配布にあたるため。rac.json には登録番号・農薬名・有効成分・RACコードだけを残す）。
name: RACコード表の更新

on:
  schedule:
    - cron: '0 21 * * 0' # 毎週月曜 6:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rac-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ACFinder の DB を取得
        run: |
          base=https://raw.githubusercontent.com/macs-labo/macs/dev/data
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/acis.db" "$base/acis.db"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/spec.db" "$base/spec.db"
          ls -l "$RUNNER_TEMP"/*.db

      - name: rac.json を作る
        run: python3 tools/build_rac.py "$RUNNER_TEMP/acis.db" "$RUNNER_TEMP/spec.db" data/rac.json

      - name: 変化があればコミット
        run: |
          if git diff --quiet -- data/rac.json; then
            echo "RACコード表に変化はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/rac.json
          ver=$(python3 -c "import json;print(json.load(open('data/rac.json',encoding='utf-8'))['acis'])")
          git commit -m "RACコード表を更新（ACFinder ${ver}）"
          git push
